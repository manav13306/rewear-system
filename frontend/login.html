<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ReWear</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">♻️ ReWear</a>
                <div class="user-menu"></div>
            </nav>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="card">
                <h1>Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your ReWear account</p>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        Sign In
                    </button>
                </form>

                <div style="margin-top: 2rem; text-align: center;">
                    <p style="color: var(--text-muted);">Don't have an account? <a href="register.html">Create one</a></p>
                    <p style="margin-top: 0.5rem;"><a href="index.html" style="color: var(--text-muted); font-size: 0.9rem;">← Back to home</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api-client.js?v=2"></script>
    <script src="js/utils.js?v=2"></script>
    <script>
        AuthHelper.redirectIfLoggedIn();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await api.login(email, password);

            if (response.success) {
                window.location.href = 'http://localhost:8000/dashboard.html';
            } else {
                UIUtils.showAlert(response.message || 'Login failed', 'error');
            }
        });
    </script>
</body>
</html>
