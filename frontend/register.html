<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ReWear</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">♻️ ReWear</a>
                <div class="user-menu"></div>
            </nav>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="card">
                <h1>Create Your Account</h1>
                <p class="auth-subtitle">Join the sustainable fashion revolution</p>

                <form id="register-form">
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" required placeholder="Your full name">
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required placeholder="Choose a username" minlength="3">
                        <small>Minimum 3 characters, no spaces</small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="Create a secure password" minlength="8">
                        <small>Minimum 8 characters, uppercase, lowercase, and number</small>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" required placeholder="Confirm your password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        Create Account
                    </button>
                </form>

                <div style="margin-top: 2rem; text-align: center;">
                    <p style="color: var(--text-muted);">Already have an account? <a href="login.html">Sign in</a></p>
                    <p style="margin-top: 0.5rem;"><a href="index.html" style="color: var(--text-muted); font-size: 0.9rem;">← Back to home</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api-client.js?v=2"></script>
    <script src="js/utils.js?v=2"></script>
    <script>
        AuthHelper.redirectIfLoggedIn();

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                UIUtils.showAlert('Passwords do not match', 'error');
                return;
            }

            const response = await api.register(
                document.getElementById('username').value,
                document.getElementById('email').value,
                password,
                document.getElementById('full_name').value
            );

            if (response.success) {
                UIUtils.showAlert('Account created successfully! Please login.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                UIUtils.showAlert(response.message || 'Registration failed', 'error');
            }
        });
    </script>
</body>
</html>
