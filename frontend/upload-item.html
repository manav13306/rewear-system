<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Item - ReWear</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">♻️ ReWear</a>
                <ul class="nav-menu">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="browse-items.html">Browse</a></li>
                </ul>
                <div class="user-menu"></div>
            </nav>
        </div>
    </header>

    <div class="container" style="max-width: 800px; margin: 2rem auto;">
        <div class="card" style="padding: 2.5rem;">
            <h1 style="margin-bottom: 0.25rem;">Upload a <span class="text-gradient">Clothing Item</span></h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Share your fashion with the community</p>
            
            <form id="upload-form">
                <div class="form-group">
                    <label for="title">Item Title *</label>
                    <input type="text" id="title" required placeholder="e.g., Blue Denim Jacket">
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" required placeholder="Describe the item..."></textarea>
                </div>

                <div class="bento-grid" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="tops">Tops</option>
                            <option value="bottoms">Bottoms</option>
                            <option value="dresses">Dresses</option>
                            <option value="outerwear">Outerwear</option>
                            <option value="footwear">Footwear</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="size">Size *</label>
                        <input type="text" id="size" required placeholder="e.g., M, L, 10">
                    </div>

                    <div class="form-group">
                        <label for="condition">Condition *</label>
                        <select id="condition" required>
                            <option value="">Select Condition</option>
                            <option value="new">New</option>
                            <option value="like_new">Like New</option>
                            <option value="good">Good</option>
                            <option value="fair">Fair</option>
                            <option value="worn">Worn</option>
                        </select>
                    </div>
                </div>

                <div class="bento-grid" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label for="brand">Brand</label>
                        <input type="text" id="brand" placeholder="e.g., Levi's">
                    </div>

                    <div class="form-group">
                        <label for="color">Color</label>
                        <input type="text" id="color" placeholder="e.g., Blue">
                    </div>

                    <div class="form-group">
                        <label for="transaction_type">Transaction Type *</label>
                        <select id="transaction_type" required>
                            <option value="">Select Type</option>
                            <option value="rent">Rent</option>
                            <option value="sell">Sell</option>
                            <option value="exchange">Exchange</option>
                            <option value="free">Free</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-6">
                        <div class="form-group" id="price-group" style="display: none;">
                            <label for="price">Selling Price ($) *</label>
                            <input type="number" id="price" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group" id="rental-price-group" style="display: none;">
                            <label for="rental_price_per_day">Rental Price per Day ($) *</label>
                            <input type="number" id="rental_price_per_day" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                </div>
                
                <div class="form-group" id="exchange-group" style="display: none;">
                    <label for="exchange_preferences">Exchange Preferences (What would you like in return?)</label>
                    <textarea id="exchange_preferences" placeholder="e.g., Looking for vintage denim, summer dresses in size M..."></textarea>
                </div>

                <div class="form-group">
                    <label for="image_url">Image URL</label>
                    <input type="url" id="image_url" placeholder="https://example.com/image.jpg">
                    <small>Paste a direct image URL</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
                    Upload Item
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="dashboard.html" style="color: var(--text-muted); font-size: 0.9rem;">← Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="js/api-client.js?v=2"></script>
    <script src="js/utils.js?v=2"></script>
    <script>
        (async () => {
            await AuthHelper.redirectIfNotLoggedIn();
            AuthHelper.updateUserMenu();
        })();

        window.addEventListener('pageshow', async (event) => {
            await AuthHelper.redirectIfNotLoggedIn();
            AuthHelper.updateUserMenu();
        });

        document.getElementById('transaction_type').addEventListener('change', (e) => {
            const type = e.target.value;
            document.getElementById('price-group').style.display = type === 'sell' ? 'block' : 'none';
            document.getElementById('rental-price-group').style.display = type === 'rent' ? 'block' : 'none';
            document.getElementById('exchange-group').style.display = type === 'exchange' ? 'block' : 'none';
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const itemData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                category: document.getElementById('category').value,
                size: document.getElementById('size').value,
                brand: document.getElementById('brand').value,
                color: document.getElementById('color').value,
                condition: document.getElementById('condition').value,
                transaction_type: document.getElementById('transaction_type').value,
                image_url: document.getElementById('image_url').value || '',
                price: document.getElementById('transaction_type').value === 'sell' ? 
                    parseFloat(document.getElementById('price').value) : null,
                rental_price_per_day: document.getElementById('transaction_type').value === 'rent' ? 
                    parseFloat(document.getElementById('rental_price_per_day').value) : null,
                exchange_preferences: document.getElementById('transaction_type').value === 'exchange' ? 
                    document.getElementById('exchange_preferences').value : ''
            };

            const response = await api.uploadItem(itemData);

            if (response.success) {
                UIUtils.showAlert('Item uploaded successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);
            } else {
                UIUtils.showAlert(response.message || 'Upload failed', 'error');
            }
        });
    </script>
</body>
</html>
